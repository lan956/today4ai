name: feed

on:
  schedule:
    # ponytail: Stagger cron at off-peak minutes (:07, :27, :47) to avoid GitHub's :00/:30 queue drops; trigger workflow_dispatch via an external cron if strict timing is needed.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tfa_rss.py, .github/workflows/feed.yml]

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build feeds
        # ponytail: Use ubuntu-latest preinstalled python3 instead of actions/setup-python; add setup-python only if a specific Python version or pip cache is needed.
        env:
          TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
          FEED_BASE_URL: ${{ vars.FEED_BASE_URL || format('https://raw.githubusercontent.com/{0}/{1}', github.repository, github.ref_name) }}
        run: python3 tfa_rss.py
      - name: Commit changed feeds
        run: |
          git add feed.xml hot.xml index.html
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh feeds"
          git push || { git pull --rebase --autostash && git push; }
